<section id="contato" class="section contact-section">
  <div class="container contact-grid">
    <div class="contact-copy">
      <span class="eyebrow">Contato</span>
      <h2>Vamos construir algo?</h2>
      <p>Envie uma mensagem com sua ideia, oportunidade ou projeto. Eu retorno assim que possível.</p>

      <a href="https://wa.me/5547992006045" target="_blank" class="btn secondary" aria-label="Fale comigo no WhatsApp">
        Chamar no WhatsApp
      </a>
    </div>

    <form class="form" (submit)="sendEmail(); $event.preventDefault()">
      <div class="grid grid-2">
        <div>
          <label for="name">Nome</label>
          <input type="text" id="name" [(ngModel)]="name" name="name" required />
        </div>
        <div>
          <label for="email">E-mail</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" required />
        </div>
      </div>
      <div class="mt-3">
        <label for="message">Mensagem</label>
        <textarea id="message" [(ngModel)]="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn mt-4">Enviar mensagem</button>
    </form>
  </div>
</section>
